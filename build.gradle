plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' // Actualizado a una versión estable compatible de Spring Boot 3
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'edu.itm'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web, Datos y Validaciones
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Documentación Swagger (Se dejó una sola versión limpia)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

	// Bases de datos
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Lombok (Desarrollo y Pruebas)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Desarrollo y Herramientas
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// PRUEBAS (JUnit 5 y Mockito vienen incluidos aquí por defecto)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}