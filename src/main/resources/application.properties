# esta es nuestra conexion a la base de datos creada para las pruebas
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=FairPlay;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
